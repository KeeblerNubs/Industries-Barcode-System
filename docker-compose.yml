services:
  barcode-system:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "change-this-secret-key"
      ADMIN_USERNAME: "admin"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin12345"
      DATABASE_PATH: "/data/barcode_system.db"
    volumes:
      - barcode-data:/data
    restart: unless-stopped

volumes:
  barcode-data:
